<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14121a">
  <title>Tábula</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 29 9.5v13L16 30 3 22.5v-13z' fill='%23e0b44c'/%3E%3Cpath d='M16 7 25 22H7z' fill='%2314121a'/%3E%3C/svg%3E">
</head>
<body>
  <!-- ======================= Entrada ======================= -->
  <section id="login" class="login" hidden>
    <div class="login-card">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 29 9.5v13L16 30 3 22.5v-13z" fill="currentColor"/><path d="M16 7 25 22H7z" fill="var(--bg)"/></svg>
        <h1>Tábula</h1>
      </div>
      <p class="muted" id="login-sub">Entre na mesa</p>

      <form id="login-form" hidden>
        <label>Quem é você?
          <select id="login-user" required></select>
        </label>
        <label>Senha
          <input id="login-pass" type="password" autocomplete="current-password" required>
        </label>
        <button class="btn primary" type="submit">Entrar</button>
      </form>

      <form id="setup-form" hidden>
        <p class="hint">Primeira vez por aqui. Crie a conta do <b>Mestre</b>; depois, no painel do mestre, você cria o usuário de cada jogador.</p>
        <label>Seu nome
          <input id="setup-name" value="Mestre" required maxlength="40">
        </label>
        <label>Senha do mestre
          <input id="setup-pass" type="password" autocomplete="new-password" required minlength="4">
        </label>
        <button class="btn primary" type="submit">Criar mesa</button>
      </form>
      <p class="error" id="login-error" role="alert"></p>
    </div>
  </section>

  <!-- ======================= Mesa ======================= -->
  <div id="app" hidden>
    <header class="topbar">
      <div class="brand small">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 29 9.5v13L16 30 3 22.5v-13z" fill="currentColor"/><path d="M16 7 25 22H7z" fill="var(--bg)"/></svg>
        <span>Tábula</span>
      </div>
      <div id="presence" class="presence" aria-label="Quem está online"></div>
      <div class="me">
        <span id="conn" class="conn" title="Conexão"></span>
        <span id="me-name"></span>
        <button id="logout" class="btn ghost sm" title="Sair">Sair</button>
      </div>
    </header>

    <main class="layout">
      <section id="pane-map" class="pane map-pane" data-pane="map">
        <div id="map-viewport" class="map-viewport" tabindex="0" aria-label="Mapa">
          <div id="map-layer" class="map-layer">
            <img id="map-img" alt="" draggable="false">
            <div id="map-grid" class="map-grid"></div>
            <div id="map-tokens"></div>
            <div id="map-fx"></div>
          </div>
          <div id="map-empty" class="map-empty" hidden></div>
        </div>
        <div class="map-hud top-left"><span id="scene-name" class="chip"></span></div>
        <div id="init-strip" class="init-strip" hidden></div>
        <div class="map-hud top-right">
          <button class="btn icon" id="zoom-in" title="Aproximar">+</button>
          <button class="btn icon" id="zoom-out" title="Afastar">−</button>
          <button class="btn icon" id="zoom-fit" title="Ajustar à tela">⤢</button>
        </div>
        <div id="token-panel" class="token-panel" hidden></div>
        <div class="map-hint muted">Toque duas vezes no mapa para sinalizar um ponto</div>
      </section>

      <aside class="sidebar">
        <nav class="tabs" id="tabs" role="tablist"></nav>
        <section class="pane" data-pane="sheet" id="pane-sheet"></section>
        <section class="pane" data-pane="chat" id="pane-chat"></section>
        <section class="pane" data-pane="init" id="pane-init"></section>
        <section class="pane" data-pane="handouts" id="pane-handouts"></section>
        <section class="pane" data-pane="journal" id="pane-journal"></section>
        <section class="pane" data-pane="compendium" id="pane-compendium"></section>
        <section class="pane" data-pane="gm" id="pane-gm"></section>
      </aside>
    </main>
    <nav class="bottom-tabs" id="bottom-tabs"></nav>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
